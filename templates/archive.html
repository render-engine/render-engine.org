{% extends '_base.html' %}
{% block content %}
<div class="container">
  <div class="latest_entries">
    {% for entry in pages %}    
      <a href="{{ entry.url_for() }}" class="card">
        <p class="title">{{ entry['title'] }}</p>
        {% if entry.description %}
          <p class="description">{{ entry.description }}</p>
        {% endif %}
        {% if entry.date %}
          <p class="published">Published: {{ entry.date | format_datetime("%B %d, %Y") }}</p>
        {% endif %}
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
